name: Hatifect CodeQL

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    - cron: "19 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hatifect-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  analyze:
    name: C# security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Set up pinned SDK and target runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - name: Cache external NuGet dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-codeql-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-codeql-nuget-
            ${{ runner.os }}-nuget-
      - name: Build every current host-free project
        run: python3 tools/validation.py build
      - name: Analyze C#
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:csharp
